name: Reseñas nuevas → historias

# Cada 30 minutos revisa los perfiles públicos de Google Maps; cada reseña nueva de 4-5★ con texto se vuelve una
# historia animada (screenshot real) y se publica en Instagram y Facebook. Repo público = minutos de Actions gratis.
on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 min (repo público: minutos gratis)
  workflow_dispatch:
    inputs:
      seco:
        description: "Sólo revisar, sin producir ni publicar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: resenas
  cancel-in-progress: false

jobs:
  resenas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        cliente: [SPK]          # SSI entra cuando Gibran lo platique con Rodrigo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Revisar, producir y publicar
        env:
          PYTHONUTF8: "1"
          RESENAS_ESTADO: estado
          RESENAS_SALIDA: ${{ runner.temp }}/salida
          META_TOKEN: ${{ secrets.META_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.seco }}" = "true" ]; then
            python -m resenas nuevas --cliente ${{ matrix.cliente }} --dry
          else
            python -m resenas nuevas --cliente ${{ matrix.cliente }} --publicar
          fi
      - name: Guardar registro
        if: always()
        run: |
          git config user.name "spekgen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add estado/
          git diff --cached --quiet || (git commit -m "registro: reseñas vistas (${{ matrix.cliente }})" && git pull --rebase && git push)
